# Amplify Hosting build spec (spec.md §3.10, Decision 24): Node 22, a clean
# install from the lockfile, the production build, and `dist` as the site.
# The response headers are in customHttp.yml and the rewrites and redirects
# in amplify-rewrites.json; src/workflows.test.ts checks all three.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
