# Response headers for every path on Amplify Hosting (spec.md §3.10,
# Decisions 24 and 40). `vite preview` serves these same headers
# (vite/hostingPlugin.ts), so the CSP is tested locally before a release;
# src/workflows.test.ts checks each one. Keep one pattern ('**'): the local
# server reads only that.
#
# Content-Security-Policy, directive by directive:
# - default-src 'none': nothing loads unless a directive below allows it.
# - script-src 'self': the bundled modules only; no inline or third-party
#   script, no eval.
# - style-src 'self' + two hashes: the bundled stylesheet, and the two
#   <style> elements the Radix primitives inject, allowed by their exact
#   text: the scroll lock behind a modal (react-remove-scroll-bar) when the
#   page shows no scroll bar, and Select's viewport. src/cspStyles.test.tsx
#   renders both and checks their hashes. React style props go through the
#   CSSOM and need nothing here.
# - img-src 'self' data:: the icons, and data: URLs for inline SVG images.
# - font-src 'self': only bundled fonts.
# - connect-src: the GitHub REST API and the Amplify endpoint of each region
#   in AMPLIFY_REGIONS (src/lib/amplify/regions.ts), nothing else; the demo
#   is simulated in the page and makes no requests.
# - frame-ancestors 'none', base-uri 'none', form-action 'none': never
#   framed, no <base> rewriting, no form posts.
customHeaders:
  - pattern: '**'
    headers:
      - key: 'Content-Security-Policy'
        value: "default-src 'none'; script-src 'self'; style-src 'self' 'sha256-nzTgYzXYDNe6BAHiiI7NNlfK8n/auuOAhh2t92YvuXo=' 'sha256-441zG27rExd4/il+NvIqyL8zFx5XmyNQtE381kSkUJk='; img-src 'self' data:; font-src 'self'; connect-src https://api.github.com https://amplify.us-east-1.amazonaws.com https://amplify.us-east-2.amazonaws.com https://amplify.us-west-1.amazonaws.com https://amplify.us-west-2.amazonaws.com https://amplify.ca-central-1.amazonaws.com https://amplify.sa-east-1.amazonaws.com https://amplify.eu-west-1.amazonaws.com https://amplify.eu-west-2.amazonaws.com https://amplify.eu-west-3.amazonaws.com https://amplify.eu-central-1.amazonaws.com https://amplify.eu-north-1.amazonaws.com https://amplify.eu-south-1.amazonaws.com https://amplify.me-south-1.amazonaws.com https://amplify.ap-south-1.amazonaws.com https://amplify.ap-east-1.amazonaws.com https://amplify.ap-northeast-1.amazonaws.com https://amplify.ap-northeast-2.amazonaws.com https://amplify.ap-northeast-3.amazonaws.com https://amplify.ap-southeast-1.amazonaws.com https://amplify.ap-southeast-2.amazonaws.com; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
      # Two years, subdomains included (www, dev and release are HTTPS too).
      - key: 'Strict-Transport-Security'
        value: 'max-age=63072000; includeSubDomains'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      # Never leak a dashboard URL to the sites it links to.
      - key: 'Referrer-Policy'
        value: 'no-referrer'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()'
      # frame-ancestors for browsers that predate it.
      - key: 'X-Frame-Options'
        value: 'DENY'
      # No window opened from elsewhere keeps a handle on this one.
      - key: 'Cross-Origin-Opener-Policy'
        value: 'same-origin'
      # Other sites can't load this site's files as subresources.
      - key: 'Cross-Origin-Resource-Policy'
        value: 'same-origin'
