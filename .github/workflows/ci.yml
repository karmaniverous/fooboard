name: CI

# Runs every quality gate on each PR (into main or prod) & push to main, on
# each supported Node major. Keep the steps in sync with the release-it
# `after:init` hooks in package.json, and the Node versions in sync with
# `engines.node`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, prod]
    # `edited` reruns the checks when a PR is retargeted (e.g. to prod).
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Knip
        run: npm run knip

      - name: Build
        run: npm run build

  # Playwright smoke and accessibility tests (spec.md §3.10, Decision 40)
  # against `vite preview` serving customHttp.yml's headers, in Chromium.
  # The release hooks don't run them: they run here, beside the quality
  # jobs. The browser pass runs every engine locally (CONTRIBUTING).
  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run e2e

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
