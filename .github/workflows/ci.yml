name: CI

# Runs every quality gate on each PR (into main or prod) & push to main, on
# each supported Node major. Keep the steps in sync with the release-it
# `after:init` hooks in package.json, and the Node versions in sync with
# `engines.node`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, prod]
    # `edited` reruns the checks when a PR is retargeted (e.g. to prod).
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Knip
        run: npm run knip

      - name: Build
        run: npm run build
